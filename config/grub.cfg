set default=0
set timeout=5

# ------------------------------------------------------------
# IULinux GRUB graphics
# ------------------------------------------------------------

insmod all_video
insmod gfxterm
insmod png

loadfont /boot/grub/fonts/unicode.pf2

set gfxmode=auto
terminal_output gfxterm

# IULinux branded background.
background_image /boot/grub/iulinux-grub-background.png

# Restrained IULinux boot palette.
set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

# ------------------------------------------------------------
# IULinux live boot entries
# ------------------------------------------------------------

menuentry "Start IULinux" {
    linux /casper/vmlinuz boot=casper username=iulinux hostname=iulinux-live ---
    initrd /casper/initrd
}

menuentry "Start IULinux (safe graphics)" {
    linux /casper/vmlinuz boot=casper username=iulinux hostname=iulinux-live nomodeset ---
    initrd /casper/initrd
}
