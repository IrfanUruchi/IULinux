# IULinux ASUS graphics-mode NVIDIA autoload guard.
#
# The wrapper preserves normal NVIDIA module loading unless
# /etc/iulinux/nvidia-autoload-blocked exists. That marker is maintained
# from the verified ASUS dgpu_disable state by IULinux graphics handling.

install nvidia /usr/lib/iulinux/iulinux-nvidia-modprobe-guard nvidia $CMDLINE_OPTS
install nvidia_modeset /usr/lib/iulinux/iulinux-nvidia-modprobe-guard nvidia_modeset $CMDLINE_OPTS
install nvidia_drm /usr/lib/iulinux/iulinux-nvidia-modprobe-guard nvidia_drm $CMDLINE_OPTS
install nvidia_uvm /usr/lib/iulinux/iulinux-nvidia-modprobe-guard nvidia_uvm $CMDLINE_OPTS
