  <rect id="decoration-inactive-topleft" x="0" y="0" width="1" height="1"
        fill="#292C32"/>
  <rect id="decoration-inactive-topright" x="11" y="0" width="1" height="1"
        fill="#292C32"/>
  <rect id="decoration-inactive-bottomleft" x="0" y="11" width="1" height="1"
        fill="#292C32"/>
  <rect id="decoration-inactive-bottomright" x="11" y="11" width="1" height="1"
