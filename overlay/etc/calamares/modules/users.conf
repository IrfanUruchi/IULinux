---
doAutologin: false
setRootPassword: false

sudoersGroup: sudo

defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names:
        - root
        - daemon
        - bin
        - sys
        - sync
        - games
        - man
        - lp
        - mail
        - news
        - uucp
        - proxy
        - www-data
        - backup
        - list
        - irc
        - apt
        - nobody
        - systemd-network
        - systemd-resolve
        - messagebus
        - syslog
        - sddm
        - polkitd
        - installer
