---
dontChroot: false

script:
    - 'KVER="$(ls -1 /lib/modules | sort -V | tail -1)"; test -n "$KVER"; cp /cdrom/casper/vmlinuz "/boot/vmlinuz-$KVER"; cp /cdrom/casper/initrd "/boot/initrd.img-$KVER"; chmod 0644 "/boot/vmlinuz-$KVER" "/boot/initrd.img-$KVER"'

i18n:
    name: "Installing IULinux kernel"
